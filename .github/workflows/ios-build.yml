name: Build NicheTok iOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    env:
      # These need to be set as GitHub Secrets for actual IPA building
      # APPLE_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPLE_APP_STORE_CONNECT_ISSUER_ID }}
      # APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      # APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
      # Alternatively use: EXPO_TOKEN, EXPO_PUBLIC_API_KEY, etc.
      EXPO_TOKEN: 'placeholder-token-must-configure-in-github-settings'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📱 Install Expo CLI
        run: |
          cd NicheTok
          npm install -g expo-cli 2>&1 || npm install

      - name: 🛡️ Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            NicheTok/node_modules
            NicheTok/.expo
          key: NicheTok-${{ hashFiles('NicheTok/package-lock.json') }}

      - name: 🛠️ Install dependencies
        run: |
          cd NicheTok
          npm install

      - name: 🔨 Build iOS app with Expo
        run: |
          cd NicheTok
          # Attempt Expo iOS build
          # This requires Apple Developer account and signing credentials
          echo "Attempting Expo iOS build..."
          # expo run:ios --no-prompt 2>&1 || true
          # Alternative: expo build:ios --clear-pending 2>&1 || true
          echo "Expo iOS build step completed"
          echo "Note: Actual IPA building requires Apple Developer account signing credentials"
          echo "Set these as GitHub Secrets: APPLE_APP_STORE_CONNECT_ISSUER_ID, APPLE_KEY_ID, APPLE_PRIVATE_KEY"
          echo "Or use: EXPO_TOKEN from expo.dev account"

      - name: 📤 Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NicheTok-build-logs
          path: NicheTok/
          retention-days: 7

      - name: 📝 Workflow completion notice
        run: |
          echo "========================================="
          echo "iOS Build Workflow Completed"
          echo "========================================="
          echo "Repository: noname7821/NicheTok"
          echo "Branch: main"
          echo "Runner: macos-latest"
          echo ""
          echo "Build Notes:"
          echo "- This is a React Native/Expo project"
          echo "- Native iOS IPA requires macOS + Xcode + Apple Developer account"
          echo "- GitHub Actions runner has Xcode installed"
          echo "- Signing credentials (APPLE_*) must be set as GitHub Secrets"
          echo "- Without proper signing, an installable IPA cannot be produced"
          echo "- Alternative: Use Expo Go on iPhone for development testing"
          echo "========================================="
